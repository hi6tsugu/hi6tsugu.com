<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="description" content="Entitizer: エンティティー (文字参照) の変換ができるオンラインツール">
    <title>Entitizer - hi6tsugu.com</title>
    <link rel="canonical" href="https://hi6tsugu.com/entitizer/">
    <link rel="stylesheet" href="/assets/style.css">
    <script defer src="/assets/scripts/theme.js"></script>
    <script defer src="/assets/scripts/entitizer.js"></script>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo.svg" width="128" height="128" alt="">
        hi6tsugu.com
      </a>
    </header>
    <main>
      <hgroup>
        <h1>Entitizer</h1>
        <p>エンティティー (文字参照) 変換オンラインツール</p>
      </hgroup>
      <noscript>
        <p>Entitizer の動作には JavaScript が必要です。<br>JavaScript を有効にしてください。</p>
      </noscript>
      <form>
        <h2>ソース、条件</h2>
        <p><textarea name="source" cols="80" rows="10" aria-label="ソース"></textarea></p>
        <ul>
          <li></li><label><input type="radio" name="target" value="all"> 全部の文字を変換</label></li></li>
          <li></li><label><input type="radio" name="target" value="some" checked> ランダムに一部の文字を変換</label></li></li>
        </ul>
        <p><button type="button">実行</button></p>
        <output>
          <h2>結果</h2>
          <p><textarea name="result" cols="80" rows="10" aria-label="結果" readonly></textarea></p>
        </output>
      </form>
    </main>
    <footer>
      <p>© 2026 Ootani Hirotsugu</p>
    </footer>
  </body>
</html>
