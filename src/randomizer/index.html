<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="description" content="ランダムな文字列を生成できるオンラインツール">
    <title>Randomizer - hi6tsugu.com</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="canonical" href="https://hi6tsugu.com/randomizer/">
    <link rel="stylesheet" href="/assets/style.css">
    <script defer src="/assets/scripts/theme.js"></script>
    <script defer src="/assets/scripts/randomizer.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://hi6tsugu.com/randomizer/#app",
        "name": "Randomizer",
        "url": "https://hi6tsugu.com/randomizer/",
        "description": "ランダムな文字列を生成できるオンラインツール",
        "inLanguage": "ja",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
        "author": { "@type": "Person", "@id": "https://hi6tsugu.com/#person" }
      }
    </script>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo.svg" width="128" height="128" alt="">
        hi6tsugu.com
      </a>
    </header>
    <main>
      <hgroup>
        <h1>Randomizer</h1>
        <p>ランダム文字列生成オンラインツール</p>
      </hgroup>
      <noscript>
        <p>Randomizer の動作には JavaScript が必要です。<br>JavaScript を有効にしてください。</p>
      </noscript>
      <form>
        <h2>条件</h2>
        <dl>
          <dt>種類</dt>
          <dd>
            <label><input type="checkbox" name="seed-number" checked> 数字</label>
            <label><input type="checkbox" name="seed-lowercase" checked> 小文字</label>
            <label><input type="checkbox" name="seed-uppercase" checked> 大文字</label>
            <label><input type="checkbox" name="seed-symbol"> 記号</label>
          </dd>
          <dt>文字数</dt>
          <dd><input type="number" name="count" min="1" value="32" aria-label="文字数"></dd>
          <dt>個数</dt>
          <dd><input type="number" name="total" min="1" value="3" aria-label="個数"></dd>
        </dl>
        <p><button type="button">実行</button></p>
        <output>
          <h2>結果</h2>
          <p><textarea name="result" cols="80" rows="10" aria-label="結果" readonly></textarea></p>
        </output>
      </form>
    </main>
    <footer>
      <p>© 2026 Ootani Hirotsugu</p>
    </footer>
  </body>
</html>
