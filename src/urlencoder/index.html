<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="description" content="URL エンコード (URL デコード) を実行できるオンラインツール">
    <title>URLEncoder - hi6tsugu.com</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="canonical" href="https://hi6tsugu.com/urlencoder/">
    <link rel="stylesheet" href="/assets/style.css">
    <script defer src="/assets/scripts/theme.js"></script>
    <script defer src="/assets/scripts/urlencoder.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://hi6tsugu.com/urlencoder/#app",
        "name": "URLEncoder",
        "url": "https://hi6tsugu.com/urlencoder/",
        "description": "URL エンコード (URL デコード) を実行できるオンラインツール",
        "inLanguage": "ja",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
        "author": { "@type": "Person", "@id": "https://hi6tsugu.com/#person" }
      }
    </script>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo.svg" width="128" height="128" alt="">
        hi6tsugu.com
      </a>
    </header>
    <main>
      <hgroup>
        <h1>URLEncoder</h1>
        <p>URL エンコード (URL デコード) 実行オンラインツール</p>
      </hgroup>
      <noscript>
        <p>URLEncoder の動作には JavaScript が必要です。<br>JavaScript を有効にしてください。</p>
      </noscript>
      <form>
        <h2>ソース、条件</h2>
        <p><textarea name="source" cols="80" rows="10" aria-label="ソース"></textarea></p>
        <ul>
          <li><label><input type="radio" name="action" value="encode-%20" checked> エンコード (半角スペースは %20)</label></li>
          <li><label><input type="radio" name="action" value="encode-+"> エンコード (半角スペースは +)</label></li>
          <li><label><input type="radio" name="action" value="decode"> デコード</label></li>
        </ul>
        <p><button type="button">実行</button></p>
        <output>
          <h2>結果</h2>
          <p><textarea name="result" cols="80" rows="10" aria-label="結果" readonly></textarea></p>
        </output>
      </form>
    </main>
    <footer>
      <p>© 2026 Ootani Hirotsugu</p>
    </footer>
  </body>
</html>
